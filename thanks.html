<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · Foldlight</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main class="hero" style="min-height:100vh; display:grid; place-items:center; text-align:center;">
  <div class="wrap" style="display:block; max-width:620px;">
    <svg data-art="shade" style="width:150px; height:150px;" aria-hidden="true"></svg>
    <h1 id="t-title" style="font-size: clamp(2rem, 6vw, 2.8rem); margin-top:12px;">You're on the list</h1>
    <p class="lede" id="t-body" style="margin: 0 auto 28px;">We'll email you the moment Drop 01 opens, and when we're at a fair near you.</p>
    <a class="btn" href="index.html">Back to Foldlight</a>
  </div>
</main>
<script>
  // Stripe's success URL is thanks.html?order=1
  if (new URLSearchParams(location.search).has("order")) {
    document.getElementById("t-title").textContent = "Thank you for your order";
    document.getElementById("t-body").textContent = "Your receipt is on its way by email. We'll be in touch about pickup or shipping.";
    document.title = "Order received · Foldlight";
  }
</script>
<script src="assets/site.js"></script>
</body>
</html>
